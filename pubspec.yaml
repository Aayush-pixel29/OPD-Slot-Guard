name: opd_slot_guard
description: "OPD Slot Guard - single-device appointment board with one local SQLite AppointmentAuthority."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependency list is frozen by the architecture gate (ADR-03 evidence):
# Flutter SDK, sqflite, path, and sqflite_common_ffi (dev) only.
dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
